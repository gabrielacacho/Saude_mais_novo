<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redefinir senha — Hub Saúde</title>

  <link rel="icon" type="image/png" href="./imagem/favicon.png" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/redefinir-senha.css" />
</head>

<body class="page-redefinir-senha page-layout--centered">

  <!-- Header padrão do sistema -->
  <div id="header-root"></div>

  <main>
    <div class="auth-wrapper">

      <div class="hub-card-auth">

        <!-- Cabeçalho do card -->
        <div class="hub-card-auth-header">
          <h1>Redefinir senha</h1>
          <p>Recupere o acesso à sua conta</p>
        </div>

        <!-- Formulário de redefinição -->
        <form id="form-redefinir-senha" class="hub-card-auth-body hub-form">

          <p class="redefinir-instrucoes">
            Informe o e-mail cadastrado na sua conta. 
            Enviaremos as instruções para redefinir sua senha.
          </p>

          <div>
            <label for="email" class="hub-label">E-mail</label>
            <input
              id="email"
              name="email"
              type="email"
              required
              autocomplete="email"
              class="hub-input"
              placeholder="seu@email.com"
            />
          </div>

          <button
            type="submit"
            class="hub-btn hub-btn--primary hub-btn--block"
          >
            Enviar instruções
          </button>

        </form>

        <!-- Voltar para o login -->
        <div class="hub-card-auth-footer">
          <a href="login.html" class="hub-link">
            ← Voltar para o login
          </a>
        </div>

      </div>

    </div>
  </main>

  <footer id="footer-root"></footer>

  <script type="module" src="js/pages/redefinir-senha.js"></script>
</body>
</html>
